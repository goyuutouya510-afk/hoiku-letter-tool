<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>保育お便り帳ジェネレーター かんたん使い方ガイド</title>
  <link rel="stylesheet" href="css/guide.css" />
</head>
<body>
  <main class="guide-sheet">
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">テストユーザー向け</p>
        <h1>保育お便り帳ジェネレーター<br />かんたん使い方ガイド</h1>
        <div class="hero-guide">
          <p>まずは下の手順01から進めてください。</p>
          <p>そのあと「アプリを開く」ボタンからそのまま使えます。</p>
        </div>
      </div>
    </section>

    <section class="steps" aria-label="使い方">
      <article class="step-card">
        <p class="step-number">01</p>
        <p class="step-text">右下の「︙」を押す</p>
      </article>
      <article class="step-card">
        <p class="step-number">02</p>
        <p class="step-text">「ブラウザで開く」を選ぶ</p>
      </article>
      <article class="step-card">
        <p class="step-number">03</p>
        <p class="step-text">下の「アプリを開く」ボタンを押す</p>
      </article>
      <article class="step-card">
        <p class="step-number">04</p>
        <p class="step-text">Googleログイン</p>
      </article>
      <article class="step-card">
        <p class="step-number">05</p>
        <p class="step-text">キーワードを入力して<br />「ChatGPTに作成してもらう」を押す</p>
      </article>
      <article class="step-card">
        <p class="step-number">06</p>
        <p class="step-text">生成された文章をコピーして<br />連絡帳アプリに貼り付け</p>
      </article>
    </section>

    <section class="cta-section" aria-label="ご利用リンク">
      <a
        class="guide-button guide-button-primary"
        href="https://hoiku-letter-tool.web.app/?test=plus"
        target="_blank"
        rel="noopener noreferrer"
      >アプリを開く</a>
      <p class="cta-note">使ったあとに、感想もらえると嬉しいです</p>
      <a
        class="guide-button guide-button-secondary"
        href="https://docs.google.com/forms/d/e/1FAIpQLScaW1UMGiZFqKds5sPPMxYxxpvAc5WHndlFAxN6dR1-XIRhnQ/viewform?usp=publish-editor"
        target="_blank"
        rel="noopener noreferrer"
      >感想を送る</a>
    </section>
  </main>
</body>
</html>
